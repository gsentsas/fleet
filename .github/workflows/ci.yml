name: Fleetbase CI

# Image-build gate: proves the Docker images still bake from source.
# This is one of four sibling checks that together gate `main`:
#   - ci.yml           → this file: docker bake (images build)
#   - install-smoke.yml → fresh install boots and serves (docker compose + deploy.sh + health)
#   - api.yml          → host Laravel PHPUnit suite + coverage
#   - console.yml      → Ember QUnit suite + coverage
# Mark all four as required status checks in branch protection so a red PR is blocked.

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, 'dev-v*', 'release/v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Start Docker Services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and Release
      uses: docker/bake-action@v2
      env:
        COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets._GITHUB_AUTH_TOKEN || github.token }}"}}'
      with:
        files: |
          ./docker-bake.hcl
