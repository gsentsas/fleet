name: Fleetbase CI

# Image-build gate: proves the Docker images still bake from source.
# This is one of four sibling checks that together gate `main`:
#   - ci.yml           → this file: docker bake (images build)
#   - install-smoke.yml → fresh install boots and serves (docker compose + deploy.sh + health)
#   - api.yml          → host Laravel PHPUnit suite + coverage
#   - console.yml      → Ember QUnit suite + coverage
# Mark all four as required status checks in branch protection so a red PR is blocked.

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, 'dev-v*', 'release/v*' ]
  workflow_dispatch:

jobs:
  build:
    if: github.ref_name != 'test/rc1-s98-r10-export-573689e'
    name: Build and Start Docker Services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and Release
      uses: docker/bake-action@v2
      env:
        COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets._GITHUB_AUTH_TOKEN || github.token }}"}}'
      with:
        files: |
          ./docker-bake.hcl


  export_candidate:
    name: Export RC1 ${{ matrix.component }} AMD64 (no push)
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'test/rc1-s98-r10-export-573689e'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [api, console, socket, httpd]
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 573689e53a7fc0ab6c90e7901c3fd58d596c2376
          persist-credentials: false
      - name: Verify exact release SHA and free space
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 573689e53a7fc0ab6c90e7901c3fd58d596c2376
          df -h /
          free_mb=$(df -Pm / | awk 'NR==2 { print $4 }')
          if (( free_mb < 6500 )); then echo '::error::Insufficient disposable runner disk'; exit 1; fi
          echo 'S98_R10_EXACT_CANDIDATE_CHECKOUT=PASS'
      - name: Set up ephemeral Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and export Docker archive, not a registry
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          set -euo pipefail
          sha=573689e53a7fc0ab6c90e7901c3fd58d596c2376
          path="$RUNNER_TEMP/candidate-$COMPONENT.docker.tar"
          args=(--platform linux/amd64 --progress plain --provenance=false --label "org.opencontainers.image.revision=$sha" --tag "gst-rc1-$COMPONENT:573689e-amd64" --output "type=docker,dest=$path")
          case "$COMPONENT" in
            api)
              args+=(--file docker/Dockerfile --target app-release --secret id=composer_auth,env=COMPOSER_AUTH)
              context='.'
              ;;
            console)
              args+=(--file console/Dockerfile)
              context='./console'
              ;;
            socket)
              args+=(--file socket/Dockerfile)
              context='./socket'
              ;;
            httpd)
              args+=(--file docker/httpd/Dockerfile)
              context='.'
              ;;
            *) echo '::error::Unexpected component'; exit 2 ;;
          esac
          docker buildx build "${args[@]}" "$context"
          test -s "$path"
          echo 'S98_R10_DOCKER_BUILD_EXPORT=PASS'
      - name: Verify image manifest, platform, revision and forbidden files
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, tarfile
          component = os.environ['COMPONENT']
          path = os.path.join(os.environ['RUNNER_TEMP'], 'candidate-' + component + '.docker.tar')
          expected_tag = 'gst-rc1-' + component + ':573689e-amd64'
          revision = '573689e53a7fc0ab6c90e7901c3fd58d596c2376'
          with tarfile.open(path) as archive:
              records = json.load(archive.extractfile('manifest.json'))
              assert len(records) == 1, 'Expected exactly one image'
              record = records[0]
              assert expected_tag in record['RepoTags'], 'Release tag mismatch'
              config = json.load(archive.extractfile(record['Config']))
              assert (config['os'], config['architecture']) == ('linux', 'amd64'), 'Wrong platform'
              assert config['config']['Labels']['org.opencontainers.image.revision'] == revision, 'Wrong SHA'
              env = config['config'].get('Env') or []
              blocked_env = ('COMPOSER_AUTH=', 'GITHUB_TOKEN=', 'GH_JOB_TOKEN=', 'FIREBASE_PRIVATE_KEY=')
              assert not any(value.startswith(blocked_env) for value in env), 'Secret in image environment'
              forbidden = ('.env', 'auth.json', 'composer-auth.json', 'id_rsa', 'composer_auth')
              for layer in record['Layers']:
                  stream = archive.extractfile(layer)
                  with tarfile.open(fileobj=stream, mode='r|*') as layer_tar:
                      for member in layer_tar:
                          parts = member.name.lstrip('./').split('/')
                          if any(part in forbidden for part in parts):
                              raise RuntimeError('Forbidden secret-like file in image layer')
          print('S98_R10_IMAGE_PLATFORM_REVISION_SECRET_PATH_CHECK=PASS')
          PY
      - name: Compress archive with bounded upload size
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/candidate-$COMPONENT.docker.tar"
          output="$RUNNER_TEMP/candidate-$COMPONENT.docker.tar.gz"
          free_mb=$(df -Pm "$RUNNER_TEMP" | awk 'NR==2 { print $4 }')
          if (( free_mb < 1500 )); then echo '::error::Insufficient scratch for export compression'; exit 1; fi
          gzip -1 -c "$input" > "$output"
          rm -f "$input"
          bytes=$(stat -c %s "$output")
          if (( bytes > 1900000000 )); then echo '::error::Compressed image exceeds guarded upload size'; exit 1; fi
          sha256sum "$output"
          gzip -t "$output"
          echo 'S98_R10_ARCHIVE_INTEGRITY=PASS'
      - name: Retain short-lived nonproduction image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gst-rc1-${{ matrix.component }}-573689e-amd64
          path: ${{ runner.temp }}/candidate-${{ matrix.component }}.docker.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Final reproducibility marker
        shell: bash
        run: echo 'S98_R10_EXPORTED_ARTIFACT=PASS'
