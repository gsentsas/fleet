name: GST P0-F8D3 real fork dependency proof (NO GO)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gst-f8d3-real-forks-solver.yml'

permissions:
  contents: read

jobs:
  real-forks-compatibility:
    name: PHP 8.2 / Composer / 3 pinned real forks (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '600'
      COMPOSER_NO_AUDIT: '0'
    steps:
      - name: Checkout original unmodified Fleetbase
        uses: actions/checkout@v4

      - name: PHP 8.2 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, pdo_mysql, pdo_sqlite, sqlite3, intl, bcmath, gmp
          coverage: none

      - name: Configure read-only GitHub Composer API token
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: composer config --global github-oauth.github.com "$GH_JOB_TOKEN"

      - name: Confirm original release is still pinned to Laravel 10
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("composer.json").read_text())
          lock=json.loads(Path("composer.lock").read_text())
          expected={
              "laravel/framework": "^10.0",
              "fleetbase/core-api": "^1.6.74",
              "fleetbase/storefront-api": "^0.4.31",
              "fleetbase/fleetops-api": "^0.6.75",
          }
          for key, version in expected.items():
              if m["require"].get(key)!=version:
                  raise SystemExit("STOP=CHANGED_ROOT_REQUIRE:"+key)
          names={p["name"]:p for p in lock.get("packages",[])}
          if names["fleetbase/core-api"]["source"]["reference"]!="ac97b5620b260660ae4e6fd5ea0e64025629b0c9":
              raise SystemExit("STOP=CHANGED_CORE_BASELINE")
          if names["fleetbase/storefront-api"]["source"]["reference"]!="2a5dd325b4d2777f0b644da53cf5c902a8e7ffc2":
              raise SystemExit("STOP=CHANGED_STOREFRONT_BASELINE")
          if names["fleetbase/fleetops-api"]["source"]["reference"]!="811aa711a68833dfd8390d8ddac582d4ed75f3c6":
              raise SystemExit("STOP=CHANGED_FLEETOPS_BASELINE")
          print("PINNED_ORIGINAL_BASELINE=PASS")
          PY

      - name: Write three real fork SHAs and Laravel 12 target in EPHEMERAL manifest only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          mfile=Path("composer.json")
          m=json.loads(mfile.read_text())
          if m.get("config",{}).get("policy",{}).get("advisories"):
              raise SystemExit("STOP=ROOT_POLICY_UNEXPECTED")
          m["require"]["laravel/framework"]="^12.69.2"
          m["require"]["fleetbase/core-api"]="dev-compat/p0-f8d3-laravel12-foundation#6193fb52c7f93c658a4afc337a62893236509c63 as 1.6.74"
          m["require"]["fleetbase/storefront-api"]="dev-compat/p0-f8d3-laravel12-foundation#5e5d0f06102005442db37d817396533df2db8300 as 0.4.31"
          m["require"]["fleetbase/fleetops-api"]="dev-compat/p0-f8d3-laravel12-barcode#3573ddc1ebffeaf54685e0f8c5df34dda234122f as 0.6.75"
          if m["require-dev"].get("nunomaduro/collision")!="^7.0":
              raise SystemExit("STOP=COLLISION_EXPECTED_7")
          if m["require-dev"].get("phpunit/phpunit")!="^10.0":
              raise SystemExit("STOP=PHPUNIT_EXPECTED_10")
          m["require-dev"]["nunomaduro/collision"]="^8.0"
          m["require-dev"]["phpunit/phpunit"]="^11.0"
          sources=[
              ("gsentsas/core-api","fleetbase/core-api"),
              ("gsentsas/storefront","fleetbase/storefront-api"),
              ("gsentsas/fleetops","fleetbase/fleetops-api"),
          ]
          m["repositories"]=[
              {"type":"vcs","url":"https://github.com/"+repo,"canonical":True,"only":[name]}
              for repo,name in sources
          ]+m.get("repositories",[])
          mfile.write_text(json.dumps(m,indent=4)+"\n")
          print("CANDIDATE_SOURCE_COUNT=3")
          print("CANDIDATE_SOURCE_PROVENANCE=EXACT_SHA")
          print("CANDIDATE_LARAVEL_TARGET=12.69.2")
          print("APP_PRODUCT_FILES_MODIFIED=NO_EPHEMERAL_CI_ONLY")
          PY
          # Lock validation is deferred until after the ephemeral Composer update:
          # this manifest intentionally differs from the still-pinned Laravel 10 lock.
          composer validate --no-check-lock --no-check-publish

      - name: Test GitHub VCS metadata access in read-only mode without printing tokens
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          while read -r repo revision; do
            [ -n "$repo" ] || continue
            uri="https://api.github.com/repos/$repo/commits/$revision"
            status_auth=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_JOB_TOKEN" "$uri")
            status_public=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" "$uri")
            echo "GITHUB_PUBLIC_REPO_STATUS=$repo auth:$status_auth anonymous:$status_public"
            if [ "$status_auth" != 200 ] && [ "$status_public" != 200 ]; then
              echo "STOP=GITHUB_METADATA_UNREADABLE"
              exit 2
            fi
          done <<'REVISIONS'
          gsentsas/core-api 6193fb52c7f93c658a4afc337a62893236509c63
          gsentsas/storefront 5e5d0f06102005442db37d817396533df2db8300
          gsentsas/fleetops 3573ddc1ebffeaf54685e0f8c5df34dda234122f
          geocoder-php/GeocoderLaravel 13.2.2
          REVISIONS
          rate=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_JOB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/rate_limit | \
            php -r '$x=json_decode(stream_get_contents(STDIN),true); echo is_array($x) ? ($x["resources"]["core"]["remaining"] ?? "UNKNOWN") : "UNAVAILABLE";')
          echo "GITHUB_TOKEN_CORE_REMAINING=$rate"
          if [ "$rate" = 0 ]; then
            # The repo-scoped Actions token has no remaining API quota.
            # Public fork refs already returned anonymous HTTP 200 above.
            # Avoid feeding an exhausted token back to Composer; do not add scopes.
            composer config --global --unset github-oauth.github.com || true
            # Force raw Git transport for public VCS metadata: no GitHub REST API quota.
            composer config --global use-github-api false
            for name in core-api storefront fleetops; do
              git ls-remote --exit-code "https://github.com/gsentsas/$name.git" HEAD >/dev/null
              echo "PUBLIC_GIT_TRANSPORT_$name=PASS"
            done
            echo "COMPOSER_SOURCE_AUTH=PUBLIC_GIT_DIRECT_NO_GITHUB_API"
          else
            echo "COMPOSER_SOURCE_AUTH=GITHUB_TOKEN_AVAILABLE"
          fi

      - name: Attempt full Composer resolution on disposable runner WITHOUT security waivers
        id: solve
        run: |
          set +e
          composer update --no-install --no-plugins --no-scripts \
            --no-progress --no-interaction --prefer-dist \
            > "$RUNNER_TEMP/gst-f8d3-real-forks-solver.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$RUNNER_TEMP/gst-f8d3-solver-rc.txt"
          echo "REAL_FORKS_SOLVER_RC=$rc"
          tail -n 180 "$RUNNER_TEMP/gst-f8d3-real-forks-solver.log"
          if [ "$rc" -ne 0 ]; then
            echo "REAL_FORKS_SOLVER=BLOCKED_NO_GO"
          else
            echo "REAL_FORKS_SOLVER=RESOLVED_CODE_UNTESTED_NO_GO"
          fi

      - name: Check exact fork commit refs ONLY if resolution passed
        run: |
          if [ "$(cat "$RUNNER_TEMP/gst-f8d3-solver-rc.txt")" -ne 0 ]; then
            echo "FORK_LOCK_PROOF=NOT_PRODUCED"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          lock=json.loads(Path("composer.lock").read_text())
          packages={p["name"]:p for p in lock.get("packages",[])}
          pins={
              "fleetbase/core-api":("https://github.com/gsentsas/core-api.git","6193fb52c7f93c658a4afc337a62893236509c63"),
              "fleetbase/storefront-api":("https://github.com/gsentsas/storefront.git","5e5d0f06102005442db37d817396533df2db8300"),
              "fleetbase/fleetops-api":("https://github.com/gsentsas/fleetops.git","3573ddc1ebffeaf54685e0f8c5df34dda234122f"),
          }
          def public_repo_path(value):
              try:
                  p=urlsplit(value)
                  if p.scheme!="https" or p.hostname!="github.com" or p.username or p.password or p.port or p.query or p.fragment:
                      return None
                  return p.path.strip("/").removesuffix(".git").lower()
              except (ValueError, TypeError):
                  return None
          for name,(url,sha) in pins.items():
              entry=packages.get(name)
              source=entry.get("source",{}) if entry else {}
              actual_path=public_repo_path(source.get("url",""))
              actual_ref=source.get("reference")
              print("FORK_CANDIDATE="+name+" path="+str(actual_path or "INVALID")+" ref="+str(actual_ref or "MISSING"))
              if actual_path!=public_repo_path(url) or actual_ref!=sha:
                  raise SystemExit("STOP=UNPINNED_FORK:"+name)
          print("ALL_THREE_FORKS_PINNED=PASS_EXACT_SHAS")
          PY
          COMPOSER_NO_AUDIT=0 composer audit --locked --format=plain

      - name: Install audited candidate dependencies in disposable runner (scripts/plugins disabled)
        run: |
          test -s composer.lock
          composer validate --no-check-publish
          COMPOSER_NO_AUDIT=0 composer install --prefer-dist --no-scripts --no-plugins \
            --no-progress --no-interaction --optimize-autoloader
          echo "LARAVEL12_EPHEMERAL_INSTALL=PASS"

      - name: Validate real PHP autoload and Laravel 12 class contracts
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'vendor/autoload.php';
          $required = [
              \Illuminate\Foundation\Application::class,
              \Fleetbase\Support\PushNotification::class,
              \Fleetbase\FleetOps\Support\Geocoding::class,
              \Geocoder\Laravel\Http\LaravelHttpClient::class,
              \AaronFrancis\FastPaginate\FastPaginateProvider::class,
          ];
          foreach ($required as $name) {
              if (!class_exists($name)) {
                  fwrite(STDERR, "STOP=RUNTIME_CLASS_NOT_FOUND:".$name."\n");
                  exit(2);
              }
          }
          if (!str_starts_with(\Illuminate\Foundation\Application::VERSION, '12.')) {
              fwrite(STDERR, "STOP=UNEXPECTED_FRAMEWORK_MAJOR\n"); exit(2);
          }
          if (!is_subclass_of(\Geocoder\Laravel\Http\LaravelHttpClient::class, \Psr\Http\Client\ClientInterface::class)) {
              fwrite(STDERR, "STOP=GEOCODER_NOT_PSR18\n"); exit(2);
          }
          echo "LARAVEL12_AUTOLOAD_SMOKE=PASS_FRAMEWORK_AND_FORKS\n";
          PHP

      - name: Exercise installed FleetOps Geocoder and notification contracts without network
        env:
          APP_ENV: testing
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'vendor/autoload.php';
          $path = 'vendor/fleetbase/fleetops-api/server/config/geocoder.php';
          if (!is_file($path)) { fwrite(STDERR, "STOP=GEOCODER_CONFIG_NOT_INSTALLED\n"); exit(2); }
          $config = require $path;
          if (($config['adapter'] ?? null) !== \Geocoder\Laravel\Http\LaravelHttpClient::class) {
              fwrite(STDERR, "STOP=GEOCODER_ADAPTER_MISMATCH\n"); exit(2);
          }
          if (!isset($config['providers'][\Geocoder\Provider\Chain\Chain::class][\Geocoder\Provider\GoogleMaps\GoogleMaps::class])) {
              fwrite(STDERR, "STOP=GOOGLE_MAPS_CHAIN_MISSING\n"); exit(2);
          }
          foreach ([
              \NotificationChannels\Fcm\FcmMessage::class,
              \NotificationChannels\Twilio\TwilioSmsMessage::class,
              \Fleetbase\Twilio\Twilio::class,
          ] as $name) {
              if (!class_exists($name)) { fwrite(STDERR, "STOP=NOTIFICATION_CLASS_MISSING:".$name."\n"); exit(2); }
          }
          echo "LARAVEL12_GEOCODER_NOTIFICATION_CONTRACTS=PASS_NO_NETWORK\n";
          PHP

      - name: Run real API PHPUnit unit tests on isolated Laravel 12 candidate
        env:
          APP_ENV: testing
          APP_URL: http://localhost.test
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          CACHE_DRIVER: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          LOG_CHANNEL: stderr
          TELESCOPE_ENABLED: 'false'
        run: |
          export APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          vendor/bin/phpunit -c phpunit.xml --testsuite Unit --colors=never
          echo "LARAVEL12_API_UNIT_TESTS=PASS"

      - name: Run real Laravel 12 API feature health endpoints against in-memory SQLite
        env:
          APP_ENV: testing
          APP_URL: http://localhost.test
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          CACHE_DRIVER: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          LOG_CHANNEL: stderr
          TELESCOPE_ENABLED: 'false'
        run: |
          export APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          vendor/bin/phpunit -c phpunit.xml --testsuite Feature --colors=never
          echo "LARAVEL12_API_FEATURE_HEALTH_TESTS=PASS"

      - name: Upload ONLY diagnostic output (no composer.lock)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gst-f8d3-real-forks-solver-logs-NOT-DEPLOYABLE
          path: |
            ${{ runner.temp }}/gst-f8d3-real-forks-solver.log
            ${{ runner.temp }}/gst-f8d3-solver-rc.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Prevent release from a compatibility experiment
        if: ${{ always() }}
        run: |
          echo "LARAVEL12_CODE_COMPATIBILITY=UNVERIFIED"
          echo "F8D3_PRODUCTION_DECISION=NO_GO"
          exit 1

  baseline-security:
    name: Original dependency security audit (must block)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: api
    env:
      COMPOSER_NO_AUDIT: '0'
    steps:
      - name: Checkout unmodified original API lock
        uses: actions/checkout@v4
      - name: Set up PHP 8.2 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Audit original API lock with no exceptions
        run: composer audit --locked --format=plain
