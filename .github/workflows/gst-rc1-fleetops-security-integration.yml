name: GST RC1 locked FleetOps security integration
on:
  pull_request:
    branches: [release/rc1-security-core-e2076d39-20261110]
    paths:
      - '.github/workflows/gst-rc1-fleetops-security-integration.yml'
      - 'scripts/rc1-fleetops-locked-overlay-proof.sh'
      - 'api/tests/Feature/Rc1MySqlQuoteTenantBoundaryTest.php'
      - 'scripts/rc1-firebase-qa-secret-preflight.sh'
      - 'scripts/rc1-firebase-qa-preflight-contract-test.py'
      - 'scripts/rc1-firebase-sdk-config-contract.php'
      - 'deploy/compose.firebase.qa.yml'
      - 'docs/rc1-firebase-gsent-it-qa-s37.md'
permissions:
  contents: read
jobs:
  locked-fleetops-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rc1_ci_ephemeral_only
          MYSQL_DATABASE: rc1_ci_tenant
          MYSQL_USER: rc1_ci
          MYSQL_PASSWORD: rc1_ci_ephemeral_only
        ports:
          - 3306:3306
    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, pdo_mysql, pdo_sqlite, sqlite3, intl, bcmath, gmp
          coverage: none
      - name: Synthetic Firebase QA preflight contract (no secrets, no Docker)
        run: python3 scripts/rc1-firebase-qa-preflight-contract-test.py
      - name: Configure read-only Composer metadata access
        working-directory: api
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: composer config --global github-oauth.github.com "$GH_JOB_TOKEN"
      - name: Exact committed lock plus pinned FleetOps security overlay
        run: bash scripts/rc1-fleetops-locked-overlay-proof.sh
      - name: Firebase SDK QA configuration resolution (no credentials)
        working-directory: api
        env:
          GOOGLE_CLOUD_PROJECT: gsent-it
          FIREBASE_CREDENTIALS: /run/secrets/gst-firebase-qa.json
          GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gst-firebase-qa.json
        run: php ../scripts/rc1-firebase-sdk-config-contract.php
      - name: Real FleetOps service-quote tenant isolation on disposable MySQL
        working-directory: api
        env:
          RC1_EPHEMERAL_MYSQL: '1'
          APP_ENV: testing
          APP_URL: http://localhost.test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rc1_ci_tenant
          DB_USERNAME: rc1_ci
          DB_PASSWORD: rc1_ci_ephemeral_only
          CACHE_STORE: array
          CACHE_DRIVER: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          LOG_CHANNEL: stderr
          TELESCOPE_ENABLED: 'false'
        run: |
          set -euo pipefail
          export APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          php -r '$ok=false; for ($i=0; $i<30; $i++) { try { $p = new PDO("mysql:host=127.0.0.1;port=3306;dbname=rc1_ci_tenant", "rc1_ci", "rc1_ci_ephemeral_only", [PDO::ATTR_TIMEOUT => 2]); $ok=true; break; } catch (PDOException $e) { sleep(2); } } if (!$ok) { fwrite(STDERR, "STOP=EPHEMERAL_MYSQL_NOT_READY\n"); exit(2); } echo "RC1_EPHEMERAL_MYSQL_READY=PASS\n";'
          vendor/bin/phpunit -c phpunit.xml --colors=never tests/Feature/Rc1MySqlQuoteTenantBoundaryTest.php
          echo RC1_REAL_MYSQL_SERVICE_QUOTE_TENANT=PASS
      - name: Real API PHPUnit Unit and Feature after patched FleetOps overlay
        working-directory: api
        env:
          APP_ENV: testing
          APP_URL: http://localhost.test
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          CACHE_DRIVER: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          LOG_CHANNEL: stderr
          TELESCOPE_ENABLED: 'false'
        run: |
          set -euo pipefail
          export APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          test "$(sha256sum composer.lock | cut -d ' ' -f1)" = '3d3ae9cfb74c7b8015f83de1d01a65b950109b2815dd566b4b5d4297cc0550bd'
          vendor/bin/phpunit -c phpunit.xml --testsuite Unit --colors=never
          echo RC1_PATCHED_API_PHPUNIT_UNIT=PASS
          vendor/bin/phpunit -c phpunit.xml --testsuite Feature --exclude-group rc1-mysql-only --colors=never
          echo RC1_PATCHED_API_PHPUNIT_FEATURE=PASS

      - name: S48 isolated MySQL complete migration replay (fail closed)
        working-directory: api
        env:
          APP_ENV: testing
          APP_URL: http://localhost.test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rc1_ci_schema
          DB_USERNAME: rc1_ci
          DB_PASSWORD: rc1_ci_ephemeral_only
          CACHE_DRIVER: array
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          TELESCOPE_ENABLED: 'false'
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "pull_request"
          test "$DB_DATABASE" = "rc1_ci_schema"
          test "$APP_ENV" = "testing"
          export APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306", "root", "rc1_ci_ephemeral_only", [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $pdo->exec("CREATE DATABASE rc1_ci_schema CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"); $pdo->exec("GRANT ALL PRIVILEGES ON rc1_ci_schema.* TO '''rc1_ci'''@'''%'''); echo "S48_FRESH_DISPOSABLE_SCHEMA=PASS\n";'
          php artisan migrate --force --no-interaction
          php artisan migrate:status --no-interaction
          echo S48_FULL_MIGRATION_REPLAY=PASS
