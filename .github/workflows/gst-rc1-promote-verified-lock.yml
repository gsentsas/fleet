name: GST RC1 one-time verified lock promotion (NO GO)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gst-rc1-promote-verified-lock.yml'

permissions:
  actions: read
  contents: write

jobs:
  promote-exact-rc1-lock:
    if: ${{ github.event.pull_request.head.repo.full_name == 'gsentsas/fleet' && github.head_ref == 'release/rc1-laravel12-consolidation-20261110' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact RC1 PR head, never main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Refuse any branch drift or unintended workflow edit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "release/rc1-laravel12-consolidation-20261110"
          test "$(git rev-parse HEAD^)" = "09ccc32d8a4ba1e73c349954af73b183a54442ed"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/gst-rc1-promote-verified-lock.yml"
          test -z "$(git status --porcelain)"
          echo "RC1_ONE_TIME_PARENT_AND_SCOPE=PASS"

      - name: Fetch exact existing CI artifact from GitHub, never ChatGPT
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/gsentsas/fleet/actions/artifacts/13753531278 \
            > "$RUNNER_TEMP/gst-rc1-artifact-metadata.json"
          python3 - "$RUNNER_TEMP/gst-rc1-artifact-metadata.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['id']==13753531278
          assert m['name']=='gst-rc1-three-fork-lock-NOT-DEPLOYABLE'
          assert m['digest']=='sha256:2483f3407e1fcb7f419fe5a4411555febf352ba77eebd83b0a02cdd30b2e9b5c'
          assert m['expired'] is False
          assert m['workflow_run']['id']==42792972158
          assert m['workflow_run']['head_sha']=='09ccc32d8a4ba1e73c349954af73b183a54442ed'
          print('RC1_GITHUB_ARTIFACT_PROVENANCE=PASS_EXACT_PINNED')
          PY
          mkdir -p "$RUNNER_TEMP/rc1-lock"
          gh run download 42792972158 --repo gsentsas/fleet \
            --name gst-rc1-three-fork-lock-NOT-DEPLOYABLE \
            --dir "$RUNNER_TEMP/rc1-lock"

      - name: Verify both payload hashes, versions, provenance and no waivers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/rc1-lock" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          directory=Path(sys.argv[1])
          exact={
              'composer.json':('be721c73404b686992d5971abe712ab2c373bd0e4ecc58bfb2d0a2021be5297c',5306),
              'composer.lock':('b73196821fe46d45eb8f4f9e2bd6b0df90a2e62d911b8f840c7fc243c94ba453',753900),
          }
          assert sorted(x.name for x in directory.iterdir())==sorted(exact)
          for name,(expected,size) in exact.items():
              f=directory/name
              assert f.is_file() and not f.is_symlink()
              payload=f.read_bytes()
              assert len(payload)==size and hashlib.sha256(payload).hexdigest()==expected
          manifest=json.loads((directory/'composer.json').read_text())
          lock=json.loads((directory/'composer.lock').read_text())
          assert manifest['require']['laravel/framework']=='^12.69.2'
          assert not manifest.get('config',{}).get('policy',{}).get('advisories')
          assert len(lock['packages'])==235 and len(lock['packages-dev'])==38
          forks={
              'fleetbase/core-api':('gsentsas/core-api','f81cf74e38f9c11d03d0da6d6bdc9a489c7a52dd','dev-compat/rc1-laravel12-core-regressions'),
              'fleetbase/fleetops-api':('gsentsas/fleetops','665e4fdf16f0344a24a273ebd1599b92ba6c2728','dev-compat/p0-f8d3-r11-unsigned-decimal'),
              'fleetbase/storefront-api':('gsentsas/storefront','b6d596154370ed5770225d889363a74fab56e584','dev-compat/p0-f8d3-r12-uuid-default'),
          }
          packages={item['name']:item for item in lock['packages']}
          for name,(repo,sha,branch) in forks.items():
              assert manifest['require'][name].startswith(branch+'#'+sha+' as ')
              source=packages[name]['source']
              assert source['reference']==sha
              assert source['url']=='https://github.com/'+repo+'.git'
          print('RC1_CANDIDATE_PAYLOAD_SHA256=PASS_EXACT_2_OF_2')
          print('RC1_CANDIDATE_FORK_PINS=PASS_EXACT_3_OF_3')
          print('RC1_CANDIDATE_PACKAGES=235_RUNTIME_38_DEV')
          PY

      - name: Commit two audited files atomically on RC1 only (non-force)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "release/rc1-laravel12-consolidation-20261110"
          cp "$RUNNER_TEMP/rc1-lock/composer.json" api/composer.json
          cp "$RUNNER_TEMP/rc1-lock/composer.lock" api/composer.lock
          git add -- api/composer.json api/composer.lock
          expected=$(printf 'api/composer.json\napi/composer.lock')
          test "$(git diff --cached --name-only)" = "$expected"
          git diff --cached --check
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(rc1): pin audited Laravel 12 three-fork Composer candidate"
          git push origin HEAD:refs/heads/release/rc1-laravel12-consolidation-20261110
          echo "RC1_COMPOSER_MANIFEST_AND_LOCK_COMMITTED=PASS"
          echo "RC1_COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PRODUCTION_DECISION=NO_GO"
